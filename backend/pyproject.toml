[project]
name = "personal-assistant-backend"
version = "0.1.0"
description = "Personal AI Assistant — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic[bedrock]>=0.43.0",
    "boto3>=1.35.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "apscheduler>=3.10.0",
    "google-auth>=2.37.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.160.0",
    "assemblyai>=0.37.0",
    "faster-whisper>=1.0.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Prompt modules contain intentionally long string literals (English prose for LLMs)
"app/modules/*/summarizer.py" = ["E501"]
"app/modules/*/parser.py" = ["E501"]
"app/modules/*/analyzer.py" = ["E501"]
"app/modules/*/generators/__init__.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: eval harness tests — run with 'pytest -m eval'",
]
