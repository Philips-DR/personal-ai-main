upstream backend {
    server 172.31.43.217:8001;
    keepalive 32;
}

upstream frontend {
    server 172.31.43.217:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name phil-afriyie.duckdns.org;

    # Timeouts — AI responses can take a while
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check (direct, no auth needed)
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend → Next.js (handles WebSocket upgrades for hot reload in dev)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass          $http_upgrade;
    }
}
